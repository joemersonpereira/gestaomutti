<!doctype html><html lang="pt-BR"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de Talentos — Estágio Mutti</title>
<style>
  :root{--bg:#f5f3ef;--surface:#fff;--line:#ddd8cf;--fg:#1c2a2e;--soft:#5d6b6e;--accent:#0d6b5e}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  .hero{text-align:center;padding:16px 0}
  .hero h1{margin:0;font-size:24px}.hero p{color:var(--soft);margin:6px 0 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .card h2{font-size:16px;margin:0 0 12px}
  label{display:block;font-size:13px;color:var(--soft);margin-bottom:10px}
  label b{display:block;color:var(--fg);font-weight:600;margin-bottom:3px}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .q{padding:10px 0;border-bottom:1px solid #f0ede7}.q:last-child{border:0}
  .q p{margin:0 0 8px;font-weight:600}
  .alt{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px;cursor:pointer}
  .btn{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
  .ok{text-align:center;padding:40px 16px}.ok .big{font-size:48px}
  .msg{margin-top:10px;color:#b45309;font-size:14px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
  <div class="hero"><h1>🎓 Banco de Talentos — Estágio</h1><p>Preencha seus dados e responda o teste. Faz parte da seleção.</p></div>
  <div id="app">
    <div class="card">Carregando…</div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var questoes=[], enviado=false;
  var app=document.getElementById('app');
  function h(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function carregar(){
    fetch('/api/publico/estagio/questoes').then(function(r){return r.json();}).then(function(qs){questoes=qs||[];render();}).catch(function(){questoes=[];render();});
  }
  function render(){
    if(enviado)return;
    app.innerHTML=
      '<div class="card"><h2>Seus dados</h2>'
      +'<label><b>Tipo de vaga *</b><select id="tipo_vaga"><option value="estagio">Estágio</option><option value="efetivo">Efetivo (CLT)</option></select></label>'
      +'<label><b>Nome completo *</b><input id="nome"></label>'
      +'<div class="grid"><label><b>CPF</b><input id="cpf"></label><label><b>Telefone</b><input id="telefone"></label></div>'
      +'<label><b>E-mail</b><input id="email" type="email"></label>'
      +'<label><b>Escola</b><input id="escola"></label>'
      +'<div class="grid"><label><b>Curso</b><input id="curso"></label><label><b>Série/Período</b><input id="serie"></label></div>'
      +'<div class="grid"><label><b>Nota do boletim (0 a 10)</b><input id="boletim" type="number" step="0.1" min="0" max="10"></label>'
      +'<label><b>Frequência escolar (%)</b><input id="frequencia" type="number" min="0" max="100"></label></div></div>'
      +'<div class="card"><h2>Teste de conhecimentos gerais</h2>'
      + (questoes.length? questoes.map(function(q,i){
          return '<div class="q"><p>'+(i+1)+'. '+h(q.pergunta)+'</p>'
            + (q.alternativas||[]).map(function(a,j){
                return '<label class="alt"><input type="radio" name="q_'+q.id+'" value="'+j+'"> '+h(a)+'</label>';
              }).join('')
            + '</div>';
        }).join('') : '<p style="color:var(--soft)">Nenhuma questão cadastrada no momento.</p>')
      +'</div>'
      +'<button class="btn" id="enviar">Enviar inscrição</button>'
      +'<div class="msg" id="msg"></div>';
    document.getElementById('enviar').onclick=enviar;
  }
  function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
  function enviar(){
    var nome=val('nome'); var msg=document.getElementById('msg');
    if(!nome){msg.textContent='Informe seu nome.';return;}
    var respostas={};
    questoes.forEach(function(q){var sel=document.querySelector('input[name="q_'+q.id+'"]:checked');if(sel)respostas[q.id]=sel.value;});
    var body={tipo_vaga:val('tipo_vaga'),nome:nome,cpf:val('cpf'),telefone:val('telefone'),email:val('email'),escola:val('escola'),curso:val('curso'),serie:val('serie'),boletim:val('boletim'),frequencia:val('frequencia'),respostas:respostas};
    document.getElementById('enviar').disabled=true; msg.textContent='Enviando…';
    fetch('/api/publico/estagio/candidato',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();}).then(function(res){
        if(res&&res.ok){enviado=true;app.innerHTML='<div class="card ok"><div class="big">✅</div><h2>Inscrição enviada!</h2><p>Obrigado, '+h(nome)+'. Sua inscrição entrou no nosso banco de talentos. Boa sorte!</p></div>';window.scrollTo({top:0});}
        else{msg.textContent=(res&&res.erro)||'Não foi possível enviar.';document.getElementById('enviar').disabled=false;}
      }).catch(function(){msg.textContent='Falha ao enviar. Tente de novo.';document.getElementById('enviar').disabled=false;});
  }
  carregar();
})();
</script>
</body></html>
