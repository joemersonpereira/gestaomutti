<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Faturas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#efece6; --line:#ddd8cf;
  --fg:#1c2a2e; --fg-soft:#5d6b6e; --accent:#0d6b5e; --accent-soft:#e3efea;
  --warn:#9a6212; --warn-soft:#f6ecd9; --crit:#a33a26; --crit-soft:#f7e6e1;
  --font-ui:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --sh:0 1px 2px rgba(28,42,46,.06),0 8px 24px -16px rgba(28,42,46,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{background:transparent}
.topin{max-width:1180px;margin:0 auto;padding:16px 16px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:22px;font-weight:700;color:#1e293b;letter-spacing:-.01em}
.brand span{color:var(--fg-soft);font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--fg-soft);font-weight:600;font-size:13px}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:18px}
.card>h2{font-size:15px;margin-bottom:4px}
.card>p.sub{margin:0 0 14px;color:var(--fg-soft);font-size:12.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .lab{color:var(--fg-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.kpi .val{font-family:var(--font-num);font-size:23px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .foot{color:var(--fg-soft);font-size:12px;margin-top:2px}
.kpi.ok{border-left:3px solid var(--accent)}
.kpi.warn{border-left:3px solid var(--warn)}
.kpi.crit{border-left:3px solid var(--crit)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-soft);min-width:0}
label.f>span{font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tablebox{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-soft);position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;background:var(--surface-2);font-family:var(--font-num)}
tfoot td:first-child{font-family:var(--font-ui)}
td input,td select{padding:4px 6px;border-radius:6px}
td input.money{text-align:right;font-family:var(--font-num);width:110px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-soft)}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.muted{color:var(--fg-soft)}
.empty{padding:26px;text-align:center;color:var(--fg-soft);border:1px dashed var(--line);border-radius:var(--r);margin-top:12px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:50;box-shadow:var(--sh)}
.split{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.hint{font-size:12px;color:var(--fg-soft);margin-top:8px}
code{font-family:var(--font-num);background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:12px}
@media (max-width:620px){.tabs{width:100%;margin-left:0}.topin{padding:10px 16px}}
</style>

<header class="top">
  <div class="topin">
    <div class="brand"><b>🧾 Faturas</b><span id="ctx">carregando…</span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="app">
  <div class="card"><h2>Abrindo o sistema…</h2><p class="sub">Buscando os dados salvos.</p></div>
</main>

<script>
(function(){
"use strict";
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const TIPOS=['BOLSA','RESCISÃO','FÉRIAS'];
const CONTAS=['SIM','PIX','NÃO'];
const DOCS=['NF','NFS-e','CUPOM FISCAL','RECIBO','SEM NOTA','SEM NOTA (INTERNACIONAL)'];
const SITS=['ABERTA','PAGA','CONTESTADA'];
const S={estagiarios:new Map(),pagamentos:new Map(),cartoes:new Map(),compras:new Map(),parcelas:new Map(),fornecedores:new Map(),notas:new Map(),planos:new Map()};
let canWrite=null,tab='painel',comp=ymNow(),ready=false;

function ymNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymLabel(ym){if(!ym)return'';const[a,m]=ym.split('-');return MESES[+m-1]+'/'+a.slice(2);}
function ymAdd(ym,k){const[a,m]=ym.split('-').map(Number);const d=new Date(a,m-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function brl(n){return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function num(v){if(typeof v==='number')return v;if(!v)return 0;const s=String(v).trim().replace(/\s|R\$/g,'');
  if(s.includes(',')&&s.includes('.'))return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  if(s.includes(','))return parseFloat(s.replace(',','.'))||0;return parseFloat(s)||0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function round2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function addMonths(iso,k){if(!iso)return'';const[y,m,d]=iso.split('-').map(Number);const last=new Date(y,m-1+k+1,0).getDate();
  return new Date(y,m-1+k,Math.min(d,last)).toISOString().slice(0,10);}
function ymOf(iso){return iso?iso.slice(0,7):'';}
function fmtDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function uid(p){return p+Math.random().toString(36).slice(2,9);}

/* ---------- dados (Gestão Mutti) ---------- */
const TOKEN=()=>localStorage.getItem('mutti_token')||'';
let cArqFile=null; // arquivo (foto/PDF) escolhido p/ a nova compra
async function api(method,path,body){
  const r=await fetch('/api/estagios'+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN()},body:body?JSON.stringify(body):undefined});
  if(r.status===401){const c=document.getElementById('ctx');if(c)c.textContent='sessão expirada — abra pelo Gestão Mutti';throw new Error('401');}
  if(r.status===403){canWrite=false;const c=document.getElementById('ctx');if(c)c.textContent='somente leitura';throw Object.assign(new Error('403'),{ro:true});}
  if(!r.ok)throw new Error('http '+r.status);
  return r.status===204?null:r.json();
}
let CONTAS_BANCO=[], LOJAS_CAD=[], PLANOS_ERP=[]; // contas de banco, lojas e plano de contas (ERP)
async function boot(){
  const ctx=document.getElementById('ctx');
  try{
    const all=await api('GET','');
    for(const c of Object.keys(S)){const m=S[c];m.clear();(all[c]||[]).forEach(d=>m.set(d.id,d));}
    canWrite=true;if(ctx)ctx.textContent='';ready=true;render();
  }catch(e){ready=true;render();}
  // contas de banco (ERP) e lojas cadastradas — para os seletores do cartão
  try{const r=await api('GET','/erp/contas');CONTAS_BANCO=(r&&r.contas)||[];}catch(e){CONTAS_BANCO=[];}
  try{const r=await api('GET','/erp/planocontas');PLANOS_ERP=(r&&r.planos)||[];}catch(e){PLANOS_ERP=[];}
  try{const r=await fetch('/api/referencias/lojas',{headers:{'Authorization':'Bearer '+TOKEN()}});const j=await r.json();LOJAS_CAD=(j&&j.lojas)||[];}catch(e){LOJAS_CAD=[];}
  render();
}
async function save(col,id,data){
  try{await api('PUT','/'+col+'/'+encodeURIComponent(id),{data});S[col].set(id,Object.assign({id},data));render();}
  catch(e){if(e&&e.ro)toast('Você não tem permissão para gravar.');else toast('Não foi possível salvar.');render();}
}
async function del(col,id){try{await api('DELETE','/'+col+'/'+encodeURIComponent(id));S[col].delete(id);render();}catch(e){toast('Não foi possível excluir.');}}
const RO=()=>canWrite===false;

/* ---------- cálculos ---------- */
function estAtivos(){return [...S.estagiarios.values()].filter(e=>e.status!=='INATIVO').sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));}
function estTodos(){return [...S.estagiarios.values()].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));}
function pagoId(ym,eid){return ym.replace('-','')+'__'+eid;}
function pagsDo(ym){return [...S.pagamentos.values()].filter(p=>p.comp===ym);}
function valorPag(p){return round2(num(p.valor)+num(p.dif));}
function totalBolsas(ym){return round2(pagsDo(ym).reduce((s,p)=>s+valorPag(p),0));}
function parcelasDo(ym){return [...S.parcelas.values()].filter(p=>ymOf(p.venc)===ym).sort((a,b)=>(a.venc||'').localeCompare(b.venc||''));}
function totalCartao(ym){return round2(parcelasDo(ym).reduce((s,p)=>s+num(p.valor),0));}
function fornecedoresLista(){const set=new Set();
  [...S.fornecedores.values()].forEach(f=>f.nome&&set.add(f.nome));
  [...S.notas.values()].forEach(n=>n.fornecedor&&set.add(n.fornecedor));
  [...S.compras.values()].forEach(c=>c.fornecedor&&set.add(c.fornecedor));
  return [...set].sort();}
function planosLista(){const set=new Set();
  [...S.planos.values()].forEach(p=>p.nome&&set.add(p.codigo?p.codigo+' - '+p.nome:p.nome));
  [...S.notas.values()].forEach(n=>n.plano&&set.add(n.plano));
  [...S.compras.values()].forEach(c=>c.plano&&set.add(c.plano));
  return [...set].sort();}
function achaNota(numero){const alvo=String(numero||'').replace(/^0+/,'').toUpperCase();
  if(!alvo)return null;
  return [...S.notas.values()].find(n=>String(n.numero||'').replace(/^0+/,'').toUpperCase()===alvo)||null;}
function cartaoNome(id){const c=S.cartoes.get(id);return c?c.apelido:'';}
function cartaoDe(id){return S.cartoes.get(id)||null;}
function compraDe(id){return S.compras.get(id)||null;}
function fechamentoVenc(cart,dataCompra){
  if(!cart||!dataCompra)return{fech:'',venc:''};
  const[y,m,d]=dataCompra.split('-').map(Number);
  const df=Number(cart.fech)||1, dv=Number(cart.venc)||1;
  const baseF=new Date(y,(d>df?m:m-1),1);
  const lastF=new Date(baseF.getFullYear(),baseF.getMonth()+1,0).getDate();
  const fech=new Date(baseF.getFullYear(),baseF.getMonth(),Math.min(df,lastF));
  const addV=dv<=df?1:0;
  const baseV=new Date(fech.getFullYear(),fech.getMonth()+addV,1);
  const lastV=new Date(baseV.getFullYear(),baseV.getMonth()+1,0).getDate();
  const venc=new Date(baseV.getFullYear(),baseV.getMonth(),Math.min(dv,lastV));
  const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return{fech:iso(fech),venc:iso(venc)};
}
function gerarParcelas(compra){
  const n=Math.max(1,Number(compra.nparc)||1), total=num(compra.total);
  const base=compra.primeira||compra.venc||compra.data;
  const normal=round2(total/n), out=[];
  for(let i=1;i<=n;i++){
    out.push({compraId:compra.id,n:i,nparc:n,venc:addMonths(base,i-1),
      valor:i===n?round2(total-normal*(n-1)):normal,situacao:'ABERTA',obs:''});
  }
  return out;
}

/* ---------- render ---------- */
const TABS=[['painel','Painel'],['cartoes','Cartões'],['compras','Compras'],['parcelas','Parcelas']];
function render(){
  const nav=document.getElementById('tabs');
  nav.innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join('');
  nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo({top:0});});
  const app=document.getElementById('app');
  if(!ready){app.innerHTML='<div class="card"><h2>Abrindo o sistema…</h2><p class="sub">Buscando os dados salvos.</p></div>';return;}
  app.innerHTML=({painel:vPainel,estagios:vEstagios,cadastro:vCadastro,cartoes:vCartoes,compras:vCompras,parcelas:vParcelas,importar:vImportar}[tab])();
  wire();
}
function seletorMes(id){
  const base=ymNow();const opts=[];
  for(let k=-14;k<=6;k++){const ym=ymAdd(base,k);opts.push(`<option value="${ym}" ${ym===comp?'selected':''}>${ymLabel(ym)}</option>`);}
  return `<label class="f" style="max-width:150px"><span>Competência</span><select id="${id}">${opts.join('')}</select></label>`;
}

function vPainel(){
  const c=totalCartao(comp);
  const prox=[...S.parcelas.values()].filter(p=>p.venc>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.venc.localeCompare(b.venc)).slice(0,8);
  const futuroTotal=round2([...S.parcelas.values()].filter(p=>p.venc>=new Date().toISOString().slice(0,10)).reduce((s,p)=>s+num(p.valor),0));
  const meses=[];for(let k=-5;k<=0;k++){const ym=ymAdd(comp,k);meses.push({ym,c:totalCartao(ym)});}
  const max=Math.max(1,...meses.map(m=>m.c));
  return `
  <div class="card"><div class="row" style="justify-content:space-between">
    <div><h2>Painel de ${ymLabel(comp)}</h2><p class="sub" style="margin:0">Faturas de cartão: parcelas com vencimento no mês.</p></div>
    ${seletorMes('selMes')}
  </div></div>
  <div class="grid kpis" style="margin-top:18px">
    <div class="kpi"><div class="lab">Cartão do mês</div><div class="val">${brl(c)}</div><div class="foot">${parcelasDo(comp).length} parcela(s)</div></div>
    <div class="kpi"><div class="lab">A vencer (de hoje em diante)</div><div class="val">${brl(futuroTotal)}</div><div class="foot">${[...S.parcelas.values()].filter(p=>p.venc>=new Date().toISOString().slice(0,10)).length} parcela(s)</div></div>
    <div class="kpi"><div class="lab">Cartões cadastrados</div><div class="val">${S.cartoes.size}</div></div>
  </div>
  <div class="split" style="margin-top:18px">
    <div class="card" style="margin:0"><h2>Últimos seis meses</h2><p class="sub">Total de cartão por competência.</p>
      <div class="tablebox"><table><thead><tr><th>Mês</th><th class="num">Cartão</th><th style="width:120px"></th></tr></thead><tbody>
      ${meses.map(m=>`<tr><td>${ymLabel(m.ym)}</td><td class="num">${brl(m.c)}</td>
        <td><div class="bar"><i style="width:${Math.round(m.c/max*100)}%"></i></div></td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="card" style="margin:0"><h2>Próximos vencimentos de cartão</h2><p class="sub">Parcelas a partir de hoje.</p>
      ${prox.length?`<div class="tablebox"><table><thead><tr><th>Vence</th><th>Documento</th><th>Cartão</th><th class="num">Valor</th></tr></thead><tbody>
        ${prox.map(p=>{const cp=compraDe(p.compraId)||{};return `<tr><td>${fmtDate(p.venc)}</td><td>${esc((cp.tipoDoc||'')+' '+(cp.numero||''))} <span class="muted">${p.n}/${p.nparc}</span></td><td>${esc(cartaoNome(cp.cartaoId))}</td><td class="num">${brl(num(p.valor))}</td></tr>`;}).join('')}
      </tbody></table></div>`:`<div class="empty">Nenhuma parcela futura lançada ainda. Cadastre uma compra na aba <b>Compras</b>.</div>`}
    </div>
  </div>`;
}

function vEstagios(){
  const lista=estAtivos();
  const pgs=new Map(pagsDo(comp).map(p=>[p.estagiarioId,p]));
  [...S.pagamentos.values()].filter(p=>p.comp===comp&&!lista.find(e=>e.id===p.estagiarioId)).forEach(p=>{
    const e=S.estagiarios.get(p.estagiarioId); if(e)lista.push(e);
  });
  const linhas=lista.map(e=>{
    const p=pgs.get(e.id)||{tipo:'BOLSA',valor:'',dif:''};
    const tot=p.valor===''&&p.dif===''?0:valorPag(p);
    return `<tr data-est="${e.id}">
      <td>${esc(e.nome)} ${e.status==='INATIVO'?'<span class="pill">inativo</span>':''}</td>
      <td><select class="pTipo">${TIPOS.map(t=>`<option ${t===(p.tipo||'BOLSA')?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><input class="money pVal" inputmode="decimal" value="${p.valor===''||p.valor==null?'':num(p.valor).toFixed(2)}"></td>
      <td><input class="money pDif" inputmode="decimal" value="${p.dif===''||p.dif==null?'':num(p.dif).toFixed(2)}"></td>
      <td class="num">${brl(tot)}</td>
      <td><span class="pill ${e.conta==='NÃO'?'warn':e.conta==='PIX'?'ok':''}">${esc(e.conta||'—')}</span></td>
      <td>${esc(e.banco||'')}</td><td>${esc(e.loja||'')}</td>
      <td><input class="pObs" value="${esc(p.obs||'')}" placeholder="observação"></td>
    </tr>`;}).join('');
  const porBanco=agrupa(pagsDo(comp),p=>(S.estagiarios.get(p.estagiarioId)||{}).banco||'—',valorPag);
  const porConta=agrupa(pagsDo(comp),p=>(S.estagiarios.get(p.estagiarioId)||{}).conta||'—',valorPag);
  return `
  <div class="card"><div class="row" style="justify-content:space-between">
    <div><h2>Lançamento de bolsas</h2><p class="sub" style="margin:0">Digite o valor de cada estagiário no mês. Salva sozinho ao sair do campo.</p></div>
    ${seletorMes('selMes')}
  </div>
  ${lista.length?`<div class="tablebox"><table><thead><tr><th>Estagiário</th><th>Tipo</th><th class="num">Valor</th><th class="num">Diferença</th><th class="num">Total</th><th>Conta</th><th>Banco</th><th>Loja</th><th>Obs. do mês</th></tr></thead>
    <tbody>${linhas}</tbody>
    <tfoot><tr><td>Total de ${ymLabel(comp)}</td><td></td><td class="num">${brl(round2(pagsDo(comp).reduce((s,p)=>s+num(p.valor),0)))}</td>
      <td class="num">${brl(round2(pagsDo(comp).reduce((s,p)=>s+num(p.dif),0)))}</td><td class="num">${brl(totalBolsas(comp))}</td><td colspan="4"></td></tr></tfoot>
    </table></div>`:`<div class="empty">Nenhum estagiário ativo. Cadastre na aba <b>Estagiários</b> ou traga do Alpha 7 na aba <b>Importar</b>.</div>`}
  </div>
  <div class="split">
    ${tabelinha('Por banco',porBanco)}
    ${tabelinha('Por conta cadastrada',porConta)}
  </div>`;
}
function agrupa(arr,keyFn,valFn){const m=new Map();arr.forEach(x=>{const k=keyFn(x);const o=m.get(k)||{n:0,v:0};o.n++;o.v=round2(o.v+valFn(x));m.set(k,o);});
  return [...m.entries()].sort((a,b)=>b[1].v-a[1].v);}
function tabelinha(titulo,dados){
  const tot=round2(dados.reduce((s,d)=>s+d[1].v,0));
  return `<div class="card" style="margin-top:18px"><h2>${titulo}</h2>
  ${dados.length?`<div class="tablebox"><table><thead><tr><th>${titulo.replace('Por ','')}</th><th class="num">Qtd</th><th class="num">Valor</th></tr></thead>
  <tbody>${dados.map(d=>`<tr><td>${esc(d[0])}</td><td class="num">${d[1].n}</td><td class="num">${brl(d[1].v)}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td>Total</td><td class="num">${dados.reduce((s,d)=>s+d[1].n,0)}</td><td class="num">${brl(tot)}</td></tr></tfoot></table></div>`
  :`<div class="empty">Sem lançamentos neste mês.</div>`}</div>`;
}

/* ---------- eventos ---------- */
function wire(){
  const sel=document.getElementById('selMes');
  if(sel)sel.onchange=()=>{comp=sel.value;render();};
  document.querySelectorAll('tr[data-est]').forEach(tr=>{
    const eid=tr.dataset.est;
    const grab=()=>({tipo:tr.querySelector('.pTipo').value,valor:tr.querySelector('.pVal').value,
      dif:tr.querySelector('.pDif').value,obs:tr.querySelector('.pObs').value});
    const commit=async()=>{
      if(RO())return render();
      const g=grab();const id=pagoId(comp,eid);
      const vazio=g.valor===''&&g.dif===''&&!g.obs;
      if(vazio){if(S.pagamentos.has(id))await del('pagamentos',id);return;}
      await save('pagamentos',id,{comp,estagiarioId:eid,tipo:g.tipo,valor:num(g.valor),dif:num(g.dif),obs:g.obs});
    };
    tr.querySelectorAll('.pVal,.pDif,.pObs').forEach(i=>i.onchange=commit);
    tr.querySelector('.pTipo').onchange=commit;
  });
  const addEst=document.getElementById('addEst');
  if(addEst)addEst.onclick=async()=>{
    const nome=document.getElementById('nNome').value.trim();
    if(!nome)return toast('Informe o nome.');
    await save('estagiarios',uid('e'),{nome,status:'ATIVO',banco:document.getElementById('nBanco').value.trim(),
      loja:document.getElementById('nLoja').value.trim(),conta:document.getElementById('nConta').value,
      pix:document.getElementById('nPix').value.trim(),cpf:'',origem:'manual'});
    toast('Estagiário cadastrado.');
  };
  document.querySelectorAll('tr[data-cad]').forEach(tr=>{
    const id=tr.dataset.cad;const e=S.estagiarios.get(id)||{};
    const commit=async()=>{ if(RO())return render();
      await save('estagiarios',id,Object.assign({},e,{nome:tr.querySelector('.cNome').value.trim(),
        status:tr.querySelector('.cStatus').value,banco:tr.querySelector('.cBanco').value.trim(),
        loja:tr.querySelector('.cLoja').value.trim(),conta:tr.querySelector('.cConta').value,
        pix:tr.querySelector('.cPix').value.trim(),cpf:tr.querySelector('.cCpf').value.trim(),id:undefined}));};
    tr.querySelectorAll('input,select').forEach(i=>i.onchange=commit);
    tr.querySelector('.cDel').onclick=async()=>{
      const temPag=[...S.pagamentos.values()].some(p=>p.estagiarioId===id);
      if(temPag)return toast('Tem pagamento lançado: marque como INATIVO em vez de excluir.');
      await del('estagiarios',id);toast('Cadastro excluído.');};
  });
  const addCart=document.getElementById('addCart');
  if(addCart)addCart.onclick=async()=>{
    const ap=document.getElementById('kApelido').value.trim();
    if(!ap)return toast('Dê um apelido ao cartão.');
    await save('cartoes',uid('k'),{apelido:ap,banco:document.getElementById('kBanco').value.trim(),
      final:document.getElementById('kFinal').value.trim(),
      loja:document.getElementById('kLoja').value.trim(),fech:Number(document.getElementById('kFech').value)||1,
      venc:Number(document.getElementById('kVenc').value)||1,status:'ATIVO'});
    toast('Cartão cadastrado.');
  };
  document.querySelectorAll('tr[data-cart]').forEach(tr=>{
    const id=tr.dataset.cart;
    const commit=async()=>{ if(RO())return render();
      await save('cartoes',id,{apelido:tr.querySelector('.kcApelido').value.trim(),banco:tr.querySelector('.kcBanco').value.trim(),
        final:tr.querySelector('.kcFinal').value.trim(),
        loja:tr.querySelector('.kcLoja').value.trim(),fech:Number(tr.querySelector('.kcFech').value)||1,
        venc:Number(tr.querySelector('.kcVenc').value)||1,status:tr.querySelector('.kcStatus').value});};
    tr.querySelectorAll('input,select').forEach(i=>i.onchange=commit);
    tr.querySelector('.kcDel').onclick=async()=>{
      const compras=[...S.compras.values()].filter(x=>x.cartaoId===id);
      if(compras.length && !confirm('Este cartão tem '+compras.length+' compra(s). Excluir o cartão e TODAS as compras e parcelas dele?'))return;
      for(const cp of compras){ for(const p of [...S.parcelas.values()].filter(x=>x.compraId===cp.id)) await del('parcelas',p.id); await del('compras',cp.id); }
      await del('cartoes',id);toast('Cartão excluído.');
    };
  });
  const prev=()=>{
    const el=document.getElementById('previa');if(!el)return;
    const c=S.cartoes.get(document.getElementById('cCart').value);
    const d=document.getElementById('cData').value;const n=Number(document.getElementById('cNparc').value)||1;
    const t=num(document.getElementById('cTotal').value);const pm=document.getElementById('cPrim').value;
    if(!c||!d)return el.textContent='Escolha cartão, data e parcelas para ver o vencimento previsto.';
    const fv=fechamentoVenc(c,d);const base=pm||fv.venc;
    el.innerHTML=`Fatura fecha em <b>${fmtDate(fv.fech)}</b> e vence em <b>${fmtDate(fv.venc)}</b>. `+
      (t?`${n}x de ${brl(round2(t/n))}, de ${fmtDate(base)} a ${fmtDate(addMonths(base,n-1))}.`:'Informe o valor para ver as parcelas.');
  };
  ['cCart','cData','cNparc','cTotal','cPrim'].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=prev;});
  if(document.getElementById('previa'))prev();
  const bNF=document.getElementById('buscaNF');
  if(bNF)bNF.onclick=async()=>{
    const msg=document.getElementById('nfMsg');
    const termo=(document.getElementById('cNum').value.trim()||document.getElementById('cForn').value.trim());
    if(!termo){msg.textContent='Digite o número da NF (ou o fornecedor) para buscar no Alpha 7.';return;}
    msg.textContent='Buscando no Alpha 7…';
    try{
      const r=await api('GET','/erp/notas?busca='+encodeURIComponent(termo));
      const lista=(r&&r.notas)||[];
      if(!lista.length){msg.textContent='Nenhuma NF encontrada no Alpha 7 para "'+termo+'".';return;}
      const alvo=String(document.getElementById('cNum').value||'').replace(/^0+/,'');
      const n=lista.find(x=>String(x.numero)===alvo)||lista[0];
      document.getElementById('cNum').value=n.numero;
      if(n.fornecedor)document.getElementById('cForn').value=n.fornecedor;
      if(n.valortotal)document.getElementById('cTotal').value=num(n.valortotal).toFixed(2);
      if(n.emissao)document.getElementById('cData').value=n.emissao;
      document.getElementById('cDoc').value='NF';
      msg.textContent='NF '+n.numero+(n.serie?'/'+n.serie:'')+' — '+(n.fornecedor||'')+' · '+brl(num(n.valortotal))+(lista.length>1?' ('+lista.length+' achadas, 1ª preenchida)':'');
      prev();
    }catch(e){msg.textContent='Erro ao buscar no Alpha 7 (abra pelo Gestão Mutti).';}
  };
  // Busca de fornecedor/laboratório ao vivo no cadastro do Alpha 7 (preenche o datalist).
  const cForn=document.getElementById('cForn');
  if(cForn){
    const box=document.getElementById('fornResults');let tf;
    const fechar=()=>{if(box)box.style.display='none';};
    const buscarForn=()=>{clearTimeout(tf);const q=cForn.value.trim();if(!box)return;if(q.length<2){fechar();return;}
      tf=setTimeout(async()=>{try{const r=await api('GET','/erp/fornecedores?busca='+encodeURIComponent(q));const fs=(r&&r.fornecedores)||[];
        if(!fs.length){box.innerHTML='<div style="padding:8px 10px;color:var(--fg-soft);font-size:12px">Nenhum fornecedor encontrado</div>';box.style.display='block';return;}
        box.innerHTML=fs.map(f=>'<div class="fornOpt" data-nome="'+esc(f.nome)+'" style="padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--surface-2)">'+esc(f.nome)+(f.cnpj?' <span style=color:var(--fg-soft)>· '+esc(f.cnpj)+'</span>':'')+'</div>').join('');
        box.style.display='block';
        box.querySelectorAll('.fornOpt').forEach(o=>{o.onmousedown=ev=>{ev.preventDefault();cForn.value=o.dataset.nome;fechar();};o.onmouseenter=()=>o.style.background='var(--surface-2)';o.onmouseleave=()=>o.style.background='';});
      }catch(e){}},300);};
    cForn.oninput=buscarForn;cForn.onfocus=buscarForn;cForn.onblur=()=>setTimeout(fechar,180);
  }
  const cArqEl=document.getElementById('cArq');
  if(cArqEl)cArqEl.onchange=e=>{const f=e.target.files[0];if(!f){cArqFile=null;return;}const fr=new FileReader();fr.onload=async()=>{cArqFile={nome:f.name,mime:f.type,dados:fr.result};
    // OCR: lê valor/fornecedor/número do comprovante e preenche o que estiver vazio
    try{toast('🔎 lendo o comprovante…');const r=await api('POST','/ler-comprovante',{dados:fr.result,tipo_mime:f.type});
      if(r&&r.ok){const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null&&v!==''&&!el.value)el.value=v;};
        set('cTotal',r.valor!=null?String(r.valor).replace('.',','):'');set('cForn',r.fornecedor||'');set('cNum',r.numero||'');
        toast((r.valor!=null?'✅ Valor lido: R$ '+r.valor:'lido')+(r.ehNf?' · 📄 nota fiscal':' · ⚠️ recibo'));}
    }catch(err){/* OCR opcional */}};
    fr.readAsDataURL(f);};
  const addCompra=document.getElementById('addCompra');
  if(addCompra)addCompra.onclick=async()=>{
    const cartaoId=document.getElementById('cCart').value;
    const total=num(document.getElementById('cTotal').value);
    const nparc=Math.max(1,Number(document.getElementById('cNparc').value)||1);
    const data=document.getElementById('cData').value;
    if(!cartaoId)return toast('Cadastre um cartão primeiro.');
    if(!total)return toast('Informe o valor total.');
    if(!data)return toast('Informe a data da compra.');
    const cart=S.cartoes.get(cartaoId);const fv=fechamentoVenc(cart,data);
    const id=uid('c');
    const compra={id,tipoDoc:document.getElementById('cDoc').value,numero:document.getElementById('cNum').value.trim(),
      fornecedor:document.getElementById('cForn').value.trim(),data,descricao:document.getElementById('cDesc').value.trim(),
      comprador:document.getElementById('cComp').value.trim(),cartaoId,total,nparc,
      plano:document.getElementById('cPlano').value.trim(),
      primeira:document.getElementById('cPrim').value||'',fech:fv.fech,venc:fv.venc,
      arquivo:(cArqFile?cArqFile.nome:''),temArquivo:!!cArqFile};
    await save('compras',id,Object.assign({},compra,{id:undefined}));
    if(cArqFile){try{await api('POST','/compra-arquivo/'+id,{nome:cArqFile.nome,tipo_mime:cArqFile.mime,dados:cArqFile.dados});}catch(e){}}
    const ps=gerarParcelas(compra);
    for(const p of ps){await save('parcelas',id+'__'+p.n,p);}
    toast(`Compra lançada em ${nparc}x.`);
    cArqFile=null;
    ['cNum','cForn','cDesc','cArq','cTotal','cPlano'].forEach(k=>{const el=document.getElementById(k);if(el)el.value='';});
  };
  document.querySelectorAll('.compVer').forEach(b=>{b.onclick=async()=>{try{const a=await api('GET','/compra-arquivo/'+b.dataset.id);const w=window.open();if(w)w.document.write(`<iframe src="${a.dados}" style="width:100%;height:100vh;border:0"></iframe>`);}catch(e){toast('Sem arquivo.');}};});
  document.querySelectorAll('tr[data-compra]').forEach(tr=>{
    tr.querySelector('.compDel').onclick=async()=>{
      const id=tr.dataset.compra;
      for(const p of [...S.parcelas.values()].filter(x=>x.compraId===id))await del('parcelas',p.id);
      await del('compras',id);toast('Compra e parcelas excluídas.');};
  });
  document.querySelectorAll('tr[data-parc]').forEach(tr=>{
    const id=tr.dataset.parc;const p=S.parcelas.get(id)||{};
    const commit=async()=>{ if(RO())return render();
      await save('parcelas',id,{compraId:p.compraId,n:p.n,nparc:p.nparc,venc:tr.querySelector('.xVenc').value,
        valor:num(tr.querySelector('.xValor').value),situacao:tr.querySelector('.xSit').value,obs:p.obs||''});};
    tr.querySelectorAll('input,select').forEach(i=>i.onchange=commit);
  });
  const impBtn=document.getElementById('impBtn');
  if(impBtn)impBtn.onclick=async()=>{
    const txt=document.getElementById('impTxt').value.trim();
    if(!txt)return toast('Cole os dados exportados.');
    const linhas=txt.split(/\r?\n/).filter(l=>l.trim());
    let novos=0,atual=0,pulados=0;
    for(const linha of linhas){
      const cols=linha.split(/\t|;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(s=>s.replace(/^"|"$/g,'').trim());
      const [nome,usuario,grupo,loja,cpf,banco]=cols;
      if(!nome||/^nome$/i.test(nome)){pulados++;continue;}
      if(grupo&&!/estag/i.test(grupo)){pulados++;continue;}
      const ja=[...S.estagiarios.values()].find(e=>(e.nome||'').toUpperCase()===nome.toUpperCase());
      const base={nome:nome.toUpperCase(),usuario:usuario||'',grupo:grupo||'ESTAGIO',loja:loja||'',cpf:cpf||'',
        banco:banco||'',origem:'alpha7'};
      if(ja){await save('estagiarios',ja.id,Object.assign({},ja,base,{id:undefined,status:ja.status||'ATIVO',
        conta:ja.conta||'NÃO',pix:ja.pix||''}));atual++;}
      else{await save('estagiarios',uid('e'),Object.assign(base,{status:'ATIVO',conta:'NÃO',pix:''}));novos++;}
    }
    document.getElementById('impMsg').textContent=`${novos} cadastrado(s), ${atual} atualizado(s), ${pulados} linha(s) ignorada(s).`;
  };
  const nfBtn=document.getElementById('nfBtn');
  if(nfBtn)nfBtn.onclick=async()=>{
    const txt=document.getElementById('nfTxt').value.trim();
    if(!txt)return toast('Cole as notas exportadas.');
    let n1=0,n2=0,ig=0;
    for(const linha of txt.split(/\r?\n/).filter(l=>l.trim())){
      const c=linha.split(/\t|;/).map(x=>x.replace(/^"|"$/g,'').trim());
      const [numero,fornecedor,cnpj,data,valor,plano,loja]=c;
      if(!numero||/n[uú]mero/i.test(numero)){ig++;continue;}
      const nota={numero,fornecedor:fornecedor||'',cnpj:cnpj||'',data:data||'',valor:num(valor),plano:plano||'',loja:loja||''};
      const ja=achaNota(numero);
      if(ja){await save('notas',ja.id,nota);n2++;}else{await save('notas','nf'+String(numero).replace(/[^0-9A-Za-z]/g,''),nota);n1++;}
      if(nota.fornecedor&&![...S.fornecedores.values()].some(f=>(f.nome||'').toUpperCase()===nota.fornecedor.toUpperCase()))
        await save('fornecedores',uid('f'),{nome:nota.fornecedor,cnpj:nota.cnpj||''});
    }
    document.getElementById('nfImpMsg').textContent=`${n1} nota(s) nova(s), ${n2} atualizada(s), ${ig} linha(s) ignorada(s).`;
  };
  const pcBtn=document.getElementById('pcBtn');
  if(pcBtn)pcBtn.onclick=async()=>{
    const txt=document.getElementById('pcTxt').value.trim();
    if(!txt)return toast('Cole o plano de contas.');
    let n=0;
    for(const linha of txt.split(/\r?\n/).filter(l=>l.trim())){
      const c=linha.split(/\t|;/).map(x=>x.replace(/^"|"$/g,'').trim());
      const [codigo,nome]=c;
      if(!codigo||/c[oó]digo/i.test(codigo))continue;
      await save('planos','p'+codigo.replace(/[^0-9A-Za-z]/g,''),{codigo,nome:nome||codigo});n++;
    }
    document.getElementById('pcMsg').textContent=`${n} conta(s) importada(s).`;
  };
}
boot();
})();
</script>

</body></html>
