<!doctype html><html lang="pt-BR"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Trade Marketing — Grupo Mutti</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#faf7f2;--surface:#fff;--line:#eae3d8;--ink:#15181d;--ink2:#3d434d;--soft:#767b85;
        --accent:#0d8a6f;--accent-d:#0b6e59;--accent2:#e9f4f0;--orange:#f6902a;--red:#e3382f;
        --g1:#0d8a6f;--g2:#f6902a;--g3:#e3382f;--fg:#15181d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 90px}
  .grad-txt{background:linear-gradient(95deg,var(--g1),var(--g2) 60%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .eyebrow{display:inline-block;font-weight:800;letter-spacing:2.5px;font-size:11.5px;text-transform:uppercase;color:var(--accent)}
  /* NAV topo — claro, Globo Ads */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;position:sticky;top:0;background:rgba(250,247,242,.88);backdrop-filter:blur(10px);z-index:8;border-bottom:1px solid transparent}
  .nav img.logo{height:26px;width:auto;display:block}
  .nav .logo{font-weight:800;font-size:21px;letter-spacing:-.6px;display:flex;align-items:center;gap:7px;color:var(--ink)}
  .nav .logo .c{color:var(--ink)}.nav .logo .o{color:var(--accent)}
  .nav .logo .plus{color:var(--accent);font-size:23px;line-height:0;font-weight:800}
  .nav .right{display:flex;gap:14px;align-items:center}
  .nav .right .mu{font-size:11px;color:var(--soft);font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .btnnav{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:700;cursor:pointer;transition:transform .12s}
  .btnnav:hover{transform:translateY(-1px)}
  /* HERO — claro, arejado, editorial */
  .hero{position:relative;overflow:hidden;padding:52px 0 26px;display:grid;grid-template-columns:1.2fr 420px;gap:40px;align-items:center}
  .hero .htext .eyebrow{margin-bottom:18px;display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px 8px 13px;color:var(--ink2);text-transform:none;letter-spacing:0;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(21,24,29,.04)}
  .hero .htext .eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--orange)}
  .hero h1{margin:0;font-size:clamp(32px,5.6vw,58px);font-weight:800;letter-spacing:-1.8px;line-height:1.02;color:var(--ink)}
  .hero h1 .hl{background:linear-gradient(95deg,var(--g1),var(--g2) 58%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lead{color:var(--ink2);font-size:clamp(15.5px,2.1vw,19px);margin:20px 0 0;max-width:46ch;line-height:1.55}
  .hero .cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
  .hero .cta a{text-decoration:none}
  .btnhero{background:linear-gradient(95deg,#0d8a6f,#f6902a 68%,#e3382f);color:#fff;border:0;border-radius:999px;padding:15px 28px;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 10px 26px rgba(227,120,60,.28);transition:transform .12s}
  .btnhero:hover{transform:translateY(-2px)}
  .btnhero.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
  .hero .trust{margin-top:22px;font-size:12.5px;color:var(--soft);display:flex;align-items:center;gap:8px}
  .hero .trust b{color:var(--accent);font-weight:700}
  /* arte do hero: moldura degradê com lettering da marca */
  .heroart{position:relative;border-radius:26px;padding:3px;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));box-shadow:0 20px 50px rgba(13,138,111,.16)}
  .heroart .in{background:#0c4b3e;border-radius:23px;aspect-ratio:4/3.5;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-start;padding:30px 28px;color:#fff;
     background-image:radial-gradient(90% 90% at 110% -10%,rgba(246,144,42,.42),transparent 50%),radial-gradient(90% 90% at -10% 110%,rgba(227,56,47,.36),transparent 52%),linear-gradient(150deg,#0f8f73,#0b6e59 60%,#09513f)}
  .heroart .spark{font-size:26px;color:#ffd9a0;margin-bottom:16px}
  .heroart .atitle{font-size:clamp(24px,3.4vw,32px);font-weight:800;line-height:1.08;letter-spacing:-.8px}
  .heroart .atext{margin-top:14px;font-size:14px;line-height:1.5;color:#d8f1e9}
  .heroart .amini{display:flex;gap:26px;margin-top:auto;padding-top:22px}
  .heroart .amini>div{display:flex;flex-direction:column}
  .heroart .amini b{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .heroart .amini span{font-size:12px;color:#bfe7db;margin-top:4px}
  /* PORTA DE ENTRADA (identificação) */
  .gate{display:flex;justify-content:center;padding:34px 0 60px}
  .gatecard{background:var(--surface);border:1px solid var(--line);border-radius:24px;max-width:540px;width:100%;padding:clamp(24px,4vw,40px);box-shadow:0 20px 50px rgba(21,24,29,.08)}
  .gatecard .eyebrow{display:block;margin-bottom:10px}
  .gatecard h1{font-size:clamp(24px,4.4vw,34px);font-weight:800;letter-spacing:-1px;line-height:1.08;margin:0 0 10px;color:var(--ink)}
  .gatecard .glead{color:var(--ink2);font-size:15px;margin:0 0 20px;max-width:44ch}
  .gatecard .gfoot{margin-top:16px;font-size:12.5px;color:var(--soft);line-height:1.5}
  .gatecard .gfoot a{font-weight:700}
  /* SEÇÃO genérica */
  .sec{padding:40px 0 10px}
  .sec>.eyebrow{display:block;margin-bottom:10px}
  .sec h2{font-size:clamp(24px,4.3vw,36px);font-weight:800;letter-spacing:-1px;line-height:1.08;margin:0 0 10px;color:var(--ink)}
  .sec .intro{color:var(--ink2);font-size:16px;margin:0 0 6px;text-align:justify}
  .barline{height:4px;width:56px;border-radius:4px;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));margin-bottom:16px}
  /* 4 pilares */
  .pilares{display:grid;grid-template-columns:1fr 1fr;gap:28px 44px;margin-top:26px}
  .pilar{display:flex;gap:16px}
  .pilar .pico{flex-shrink:0;width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
  .pilar .pico svg{width:26px;height:26px}
  .pilar .pico svg *{stroke:url(#mg);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .pilar h3{margin:0 0 5px;font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
  .pilar p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5;max-width:46ch}
  /* busca + abas (estilo Globo) */
  .buscabar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:18px 0 8px;width:100%}
  .buscabar .bi{font-size:16px;opacity:.6}
  .buscabar input{border:0;outline:0;padding:11px 0;font-size:15px;background:transparent;flex:1}
  .buscabar .bx{border:0;background:var(--accent2);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .tabbar{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-top:10px}
  .tab{display:flex;align-items:center;gap:7px;padding:13px 16px;font-weight:700;font-size:15px;color:var(--soft);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .1s}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .tab .tc{font-size:11px;font-weight:800;background:var(--line);color:var(--ink2);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
  .tab.on .tc{background:var(--accent);color:#fff}
  .tabdesc{color:var(--soft);font-size:14.5px;margin:16px 2px 18px;max-width:78ch;line-height:1.5}
  /* NÚMEROS / quem somos */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:22px}
  .stat{background:var(--surface);padding:20px 18px}
  .stat.hl{background:linear-gradient(150deg,#0f8f73,#0b6e59);color:#fff}
  .stat .k{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--soft);font-weight:700}
  .stat.hl .k{color:#bfe7db}
  .stat .v{font-size:clamp(24px,3.4vw,32px);font-weight:800;letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat .d{font-size:12.5px;color:var(--soft);margin-top:4px;line-height:1.4}
  .stat.hl .d{color:#d8f1e9}
  .pracas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .praca{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;color:var(--ink2)}
  .praca b{color:var(--ink)}
  .srcline{font-size:12px;color:var(--soft);margin-top:14px}
  /* TESE / proteção */
  .tese{background:linear-gradient(150deg,#0f8f73,#0b6e59 62%,#09513f);color:#fff;border-radius:24px;padding:clamp(26px,4vw,42px);margin-top:26px;position:relative;overflow:hidden}
  .tese::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(circle,rgba(246,144,42,.5),transparent 70%)}
  .tese>*{position:relative;z-index:1}
  .tese .big{font-size:clamp(20px,3.3vw,28px);font-weight:800;letter-spacing:-.5px;line-height:1.2;max-width:24ch}
  .tese .big .y{color:#ffd27a}
  .tese p{color:#d8f1e9;font-size:15px;max-width:62ch;margin:14px 0 0}
  .tese .shield{display:inline-flex;align-items:center;gap:9px;margin-top:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;font-size:13.5px;color:#eafff8;max-width:62ch}
  .tese .shield b{color:#fff}
  /* COMO FUNCIONA — passos numerados */
  .steps{margin-top:14px}
  .step{display:grid;grid-template-columns:64px 1fr 200px;gap:24px;align-items:center;padding:24px 0;border-top:1px solid var(--line)}
  .step .num{font-size:44px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
  .step .txt h3{font-size:clamp(18px,2.6vw,23px);font-weight:800;letter-spacing:-.4px;margin:0 0 6px;color:var(--ink)}
  .step .txt p{margin:0;color:var(--ink2);font-size:15px;max-width:52ch}
  .step .art{border-radius:18px;padding:2.5px;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3))}
  .step .art .in{background:var(--surface);border-radius:16px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  .step .art svg{width:52%;height:52%}
  .step .art svg *{stroke:url(#mg);stroke-width:5.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  /* catálogo header */
  .seccao{display:flex;align-items:baseline;gap:12px;margin:8px 2px 6px}
  .seccao h2{font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:-.8px;margin:0;color:var(--ink)}
  .seccao .ln{display:none}
  header.mini{padding:26px 0 4px}header.mini h1{font-size:26px;margin:4px 0;font-weight:800;letter-spacing:-.6px}header.mini p{color:var(--soft);font-size:14px;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
  .cat{display:flex;gap:22px;align-items:flex-start;margin-top:8px}
  .side{width:224px;flex-shrink:0;position:sticky;top:76px}
  .side .grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px}
  .side .grp h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--soft);margin:2px 6px 10px;font-weight:700}
  .fitem{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:11px;cursor:pointer;font-size:14px;color:var(--ink2);transition:background .1s}
  .fitem:hover{background:#f3efe8}
  .fitem.on{background:var(--ink);color:#fff;font-weight:700}
  .fitem .c{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
  .fitem.on .c{opacity:.75}
  .catmain{flex:1;min-width:0}
  .seg{margin-bottom:34px}
  .seghd{margin:0 2px 14px}
  .seghd h2{font-size:clamp(20px,3.3vw,26px);margin:0;font-weight:800;letter-spacing:-.6px;color:var(--ink)}
  .seghd p{font-size:14px;color:var(--soft);margin:4px 0 0;max-width:70ch;line-height:1.5}
  .seghd .bar{position:static;display:block;height:4px;width:50px;border-radius:4px;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));margin-bottom:10px;padding:0;border:0;box-shadow:none}
  .card.dest{border:2px solid var(--orange);box-shadow:0 6px 18px rgba(246,144,42,.18)}
  .card .star{position:absolute;top:8px;right:8px;background:linear-gradient(90deg,var(--orange),var(--red));color:#fff;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px}
  /* Card: foto com título sobreposto + rodapé branco (preço + Ver espaço) */
  .gcard{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(21,24,29,.08);transition:transform .14s,box-shadow .14s}
  .gcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(21,24,29,.16)}
  .gcard.dest{border:2px solid var(--orange);box-shadow:0 10px 26px rgba(246,144,42,.22)}
  .gpic{position:relative;aspect-ratio:16/11;background:#20302c center/cover no-repeat;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
  .gpic::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.02) 42%,rgba(0,0,0,.74) 100%)}
  .gpic .noimg{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#0f8f73,#0b6e59 70%,#09513f)}
  .gpic .noimg svg{width:40%;height:40%;opacity:.92}
  .gpic .noimg svg *{stroke:rgba(255,255,255,.95);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .gpic .tagL{position:absolute;top:11px;left:11px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
  .gpic .tagR{position:absolute;top:11px;right:11px;z-index:2}
  .tg{font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;color:#fff;letter-spacing:.2px}
  .tg.d{background:var(--orange)}
  .tg.o{background:#b91c1c}
  .tg.p{background:#fff;color:var(--ink)}
  .gpic .info{position:relative;z-index:2;padding:13px 15px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .gpic .lj{font-size:11px;opacity:.9;letter-spacing:.3px;font-weight:600}
  .gpic .nm{font-size:19px;font-weight:800;line-height:1.14;margin-top:3px;letter-spacing:-.3px}
  .gfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px}
  .gprice{display:flex;flex-direction:column;line-height:1.15}
  .gprice span{font-size:11px;color:var(--soft)}
  .gprice b{font-size:18px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .gprice i{font-size:11px;color:var(--accent);font-style:normal;font-weight:700}
  .gver{background:linear-gradient(95deg,#0d8a6f,#f6902a 70%,#e3382f);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
  /* Detalhe */
  .gal{width:100%;border-radius:14px;overflow:hidden;background:#eef2f0}
  .gal .main{width:100%;aspect-ratio:16/10;background:#eef2f0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px;color:#9fb3ad}
  .gal .thumbs{display:flex;gap:6px;padding:6px;overflow-x:auto}
  .gal .thumbs div{width:58px;height:44px;border-radius:7px;background:#ddd center/cover no-repeat;flex-shrink:0;cursor:pointer;border:2px solid transparent}
  .gal .thumbs div.on{border-color:var(--accent)}
  @media(max-width:860px){.hero{grid-template-columns:1fr;gap:24px;padding-top:34px}.heroart{max-width:380px}.step{grid-template-columns:48px 1fr;gap:16px}.step .art{display:none}}
  @media(max-width:720px){.cat{flex-direction:column}.side{width:100%;position:static}.side .grp{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto}.side .grp h3{width:100%}.fitem{border:1px solid var(--line)}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card.occ{opacity:.85}
  .card .ph{height:120px;background:#eef2f0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#9fb3ad;font-size:30px;position:relative}
  .card .tag{position:absolute;top:8px;left:8px;background:#b91c1c;color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
  .card .bd{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:3px}
  .card .area{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.3px}
  .card .nome{font-weight:700;font-size:15px}
  .card .meta{font-size:12px;color:var(--soft)}
  .card .preco{font-weight:800;color:var(--accent);font-size:16px;margin-top:4px}
  .pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--accent2);color:var(--accent);font-weight:700}
  .qt{display:flex;align-items:center;gap:8px;margin-top:8px}
  .qt button{width:30px;height:30px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;font-size:17px;font-weight:700;cursor:pointer}
  .qt b{min-width:20px;text-align:center}
  .add{margin-top:8px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:9px;padding:9px;font-weight:700;cursor:pointer;font-size:13px}
  .add.on{background:var(--accent);color:#fff}
  .fila{margin-top:8px;border:1px solid #b45309;background:#fff;color:#b45309;border-radius:9px;padding:9px;font-weight:700;cursor:pointer;font-size:12.5px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:13px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -4px 18px rgba(21,24,29,.08);z-index:9}
  .bar .inner{max-width:1240px;margin:0 auto;width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .bar b{font-size:16px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.5}.btn.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .modal{position:fixed;inset:0;background:rgba(21,24,29,.5);display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto;z-index:20}
  .sheet{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:22px;margin-top:20px}
  h2{font-size:19px;margin:0 0 10px;letter-spacing:-.4px}
  label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:10px}
  label b{display:block;color:var(--ink);font-weight:600;margin-bottom:3px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+(e.tamanho?'<span class="pill">📐 '+h(e.tamanho)+'</span>':'')+'<span class="pill">'+h(e.prazo_rotulo)+'</span>'+(e.destaque?'<span class="pill" style="background:#fde8d5;color:#b45309">✨ Destaque</span>':'')+(e.ocupado?'<span class="pill" style="background:#fde2e1;color:#b91c1c">Ocupado</span>':'')+'</div>'+
      '<div class="preco" style="font-size:22px;color:var(--accent);font-weight:800;margin-top:8px">'+brl(e.preco_unit)+'</div>'+

    if(e.ocupado){el('dfila').onclick=function(){m.remove();filaModal(id);};}
    else{var cq=q||1;function up(){el('dq').textContent=cq;el('dadd').textContent='Adicionar ao pedido';}
      el('dinc').onclick=function(){cq=Math.min(max,cq+1);up();};el('ddec').onclick=function(){cq=Math.max(1,cq-1);up();};

  });

  document.body.appendChild(m);

  function cxMeses(){var a=el('vini')&&el('vini').value,b=el('vfim')&&el('vfim').value;if(!a||!b)return 1;var dd=(new Date(b)-new Date(a))/(30*864e5);return Math.max(1,Math.round(dd)||1);}

function addPag(){var box=el('pags');var d=document.createElement('div');d.className='pagrow row';d.style.marginTop='8px';
  d.innerHTML='<label style="margin:0"><b>Data</b><input type="date" class="pv"></label><label style="margin:0"><b>Valor</b><input type="number" class="pvl" placeholder="0,00"></label>';box.appendChild(d);}
function sucesso(j){_planoCompra=null;app.innerHTML='<div class="ok"><div class="big">✅</div><h2>Pedido enviado!</h2><p>Código <b>'+h(j.codigo)+'</b> · '+brl(j.valor)+'</p><p style="color:#64748b">Nossa equipe vai confirmar. Guarde o link de acompanhamento:</p><p><a href="/trade.html?t='+h(j.token)+'">Acompanhar meu pedido</a></p></div>';var b=document.querySelector('.bar');if(b)b.remove();}

// ===== LOGIN =====
function loginModal(){
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="sheet"><h2>Acompanhar meus pedidos</h2><label><b>CNPJ</b><input id="lcnpj"></label><label><b>E-mail</b><input id="lmail" type="email"></label><label><b>Senha</b><input id="lsenha" type="password"></label><div class="msg" id="lmsg"></div><div style="display:flex;gap:10px;margin-top:8px"><button class="btn sec" id="lcancel" style="flex:1">Fechar</button><button class="btn" id="lent" style="flex:2">Entrar</button></div></div>';
  document.body.appendChild(m);el('lcancel').onclick=function(){m.remove();};
  el('lent').onclick=function(){var b={cnpj:el('lcnpj').value,email:el('lmail').value,senha:el('lsenha').value};el('lent').disabled=true;el('lmsg').textContent='Entrando…';
    post('/login',b).then(function(r){if(r.ok){m.remove();listaPedidos(r.j);}else{el('lmsg').className='msg err';el('lmsg').textContent=r.j.erro||'Erro.';el('lent').disabled=false;}});};
}
function listaPedidos(d){
  var lin=(d.pedidos||[]).map(function(p){return '<tr><td><a href="/trade.html?t='+h(p.token)+'">'+h(p.codigo)+'</a></td><td>'+h(p.status)+'</td><td style="text-align:right">'+brl(p.valor)+'</td></tr>';}).join('');
  app.innerHTML='<header class="mini"><h1>📋 Meus pedidos</h1><p>'+h(d.fornecedor||'')+'</p></header><div class="card" style="padding:14px;margin-top:12px"><table><tr><th>Código</th><th>Situação</th><th style="text-align:right">Valor</th></tr>'+(lin||'<tr><td colspan="3">Nenhum pedido.</td></tr>')+'</table></div><p style="text-align:center;margin-top:14px"><a href="/trade.html">← ver catálogo</a></p>';
  var b=document.querySelector('.bar');if(b)b.remove();
}

// ===== ACOMPANHAMENTO =====
function metaHtml(d){
  if(!d.meta)return '';var m=d.meta;var pct=m.pct==null?0:m.pct;var cor=pct>=100?'#15803d':pct>=60?'#b45309':'#b91c1c';
  var rot={mensal:'no mês',trimestral:'no trimestre',semestral:'no semestre'}[m.periodicidade]||'';
  return '<div class="card" style="padding:14px;margin-top:12px"><b>🤝 Compromisso de compra (nossa contrapartida)</b>'+
    '<div style="font-size:12px;color:#64748b;margin:2px 0 8px">Compramos de você '+rot+' · período '+h((m.periodo||{}).ini||'')+' a '+h((m.periodo||{}).fim||'')+'</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:120px;background:#f8fafc;border-radius:10px;padding:10px"><div style="font-size:11px;color:#64748b">COMPROMISSO</div><div style="font-weight:700;font-size:17px">'+brl(m.valor)+'</div></div>'+
    '<div style="flex:1;min-width:120px;background:#f8fafc;border-radius:10px;padding:10px"><div style="font-size:11px;color:#64748b">JÁ COMPRAMOS</div><div style="font-weight:700;font-size:17px">'+brl(m.comprado)+'</div></div>'+
    '<div style="flex:1;min-width:120px;background:#f8fafc;border-radius:10px;padding:10px"><div style="font-size:11px;color:#64748b">ATINGIDO</div><div style="font-weight:800;font-size:18px;color:'+cor+'">'+pct+'%</div></div></div></div>';
}
function selloutHtml(d){
  if(!d.produtos_definidos)return '<div class="card" style="padding:14px;margin-top:12px"><b>📊 Resultado das vendas</b><div style="color:#64748b;font-size:13px;margin-top:4px">Assim que os produtos da ação forem confirmados, aparece aqui a comparação de vendas antes × depois.</div></div>';
  var s=d.sellout;if(!s)return '';var v=s.variacao;var cor=v==null?'#64748b':v>0?'#15803d':v<0?'#b91c1c':'#64748b';
  var titulo=s.iniciou?'Durante a ação × período anterior':'Panorama antes da ação (últimos 30 dias)';
  return '<div class="card" style="padding:14px;margin-top:12px"><b>📊 Resultado das vendas</b><div style="font-size:12px;color:#64748b;margin:2px 0 8px">'+titulo+'</div><div style="display:flex;gap:10px;flex-wrap:wrap">'+
    '<div style="flex:1;min-width:120px;background:#f8fafc;border-radius:10px;padding:10px"><div style="font-size:11px;color:#64748b">ANTES</div><div style="font-weight:700;font-size:17px">'+brl(s.antes.valor)+'</div><div style="font-size:11px;color:#94a3b8">'+(s.antes.qtd||0)+' un</div></div>'+
    '<div style="flex:1;min-width:120px;background:'+(v>0?'#eafaf1':'#f8fafc')+';border-radius:10px;padding:10px"><div style="font-size:11px;color:#64748b">'+(s.iniciou?'AGORA':'ATUAL')+'</div><div style="font-weight:700;font-size:17px">'+brl(s.atual.valor)+'</div><div style="font-size:11px;color:#94a3b8">'+(s.atual.qtd||0)+' un</div></div>'+
    '<div style="flex:1;min-width:120px;background:#f8fafc;border-radius:10px;padding:10px"><div style="font-size:11px;color:#64748b">VARIAÇÃO</div><div style="font-weight:800;font-size:18px;color:'+cor+'">'+(v==null?'—':(v>0?'+':'')+v+'%')+'</div></div></div></div>';
}
function verAcompanhamento(){
  get('/acompanhamento/'+token).then(function(d){
    if(!d.ok){app.innerHTML='<div class="note">Pedido não encontrado. Confira o link.</div>';return;}
    var esc=(d.escopo_ref||[]).map(function(x){return h(x.nome);}).join(', ');
    var arteRot={pendente:'⏳ aguardando material',enviada:'📎 material enviado',aprovada:'✅ arte aprovada',reprovada:'✖ arte reprovada — reenviar'};
    var tipoRot={anexo:'arte/spot enviado',texto:'texto p/ leitura ao vivo',producao:'produção pelo Grupo Mutti (+R$150)'};
    var espH=(d.espacos||[]).map(function(e){
      var det=[e.modo_venda==='insercao'?('Inserção'+(e.insercoes?' · '+e.insercoes+'×':'')+(e.agenda?' · '+h(e.agenda):'')):'Período fechado'];
      if(e.criativo_tipo)det.push(tipoRot[e.criativo_tipo]||e.criativo_tipo);
      if(e.producao_isenta)det.push('arte isenta pela Mutti');
      if(e.briefing)det.push('briefing enviado');
      return '<tr><td>'+(e.quantidade>1?e.quantidade+'× ':'')+h(e.espaco_desc)+
        '<div style="font-size:11.5px;color:#64748b;margin-top:2px">'+det.join(' · ')+' · <b style="color:#334">'+(arteRot[e.arte_status]||'')+'</b>'+(e.arte_obs?' — <i>'+h(e.arte_obs)+'</i>':'')+'</div>'+
        (e.arte_status==='reprovada'?'<button class="btn sec" style="padding:4px 9px;font-size:11.5px;margin-top:5px" data-reenv="'+h(e.id)+'">↩ Reenviar material</button>':'')+'</td>'+
        '<td>'+h(e.loja_nome||'')+'</td><td style="text-align:right">'+brl(e.valor)+'</td></tr>';}).join('');
    var parH=(d.parcelas||[]).map(function(p){return '<tr><td>'+(p.vencimento||'—')+'</td><td>'+h(p.forma||'')+'</td><td style="text-align:right">'+brl(p.valor)+'</td><td>'+(p.recebido?'✅ confirmado':(p.tem_comprovante?'📎 enviado':'—'))+'</td><td>'+(p.tem_comprovante?'':'<button class="btn sec" style="padding:5px 9px;font-size:12px" data-cp="'+p.numero+'">anexar</button>')+'</td></tr>';}).join('');
    app.innerHTML='<header class="mini"><h1>📋 Pedido '+h(d.codigo)+'</h1><p>'+h(d.fornecedor||'')+'</p></header>'+
      '<div class="note"><b>Situação:</b> '+h(d.status_rotulo)+(d.vigencia_ini?' · período '+h(d.vigencia_ini)+' a '+h(d.vigencia_fim||''):'')+'</div>'+
      '<div class="card" style="padding:14px;margin-top:12px"><b>Espaços</b><table>'+espH+'<tr><td colspan="2"><b>Total</b></td><td style="text-align:right"><b>'+brl(d.valor)+'</b></td></tr></table></div>'+
      (esc?'<div class="card" style="padding:14px;margin-top:12px"><b>Produtos da ação</b><div style="color:#475569;font-size:13px;margin-top:4px">'+esc+'</div></div>':'')+
      metaHtml(d)+selloutHtml(d)+
      '<div class="card" style="padding:14px;margin-top:12px"><b>Pagamentos</b>'+(parH?'<table><tr><th>Data</th><th>Forma</th><th style="text-align:right">Valor</th><th>Status</th><th></th></tr>'+parH+'</table>':'<div style="color:#64748b;font-size:13px;margin-top:4px">Nenhum pagamento informado ainda.</div>')+
        '<button class="btn sec" id="infpag" style="margin-top:10px;padding:8px 12px;font-size:13px">➕ Informar um pagamento</button></div>'+
      '<div class="card" style="padding:14px;margin-top:12px"><b>Comprovação da ação montada</b>'+
        (d.comprovacao_enviada?'<div class="msg ok">✅ Foto já enviada. Obrigado!</div>':
          '<div style="font-size:13px;color:#64748b;margin:6px 0">Envie a foto da ação montada'+(d.comprovacao_prazo_dias?' (prazo de '+d.comprovacao_prazo_dias+' dias)':'')+'.</div><input type="file" id="cfoto" accept="image/*" capture="environment"><div class="msg" id="cmsg"></div><button class="btn" id="cenv" style="margin-top:8px">Enviar comprovação</button>')+
      '</div>'+
      '<div class="card" style="padding:14px;margin-top:12px"><b>💬 Briefing</b>'+
        '<div style="font-size:12px;color:#64748b;margin:4px 0 8px">Converse com a nossa equipe, anexe arquivos e acompanhe a comprovação da ação.</div>'+
        '<div id="brieflist" style="display:grid;gap:8px;max-height:300px;overflow:auto"></div>'+
        '<div style="display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap"><input id="brieftxt" placeholder="escreva uma observação…" style="flex:1;min-width:150px"><input type="file" id="brieffile" accept="image/*,application/pdf,video/*" style="max-width:150px"><button class="btn" id="briefsend" style="padding:8px 14px">Enviar</button></div>'+
      '</div>'+
      '<div class="card" style="padding:14px;margin-top:12px"><b>🔄 Recomprar / renovar</b>'+
        '<div style="font-size:13px;color:#64748b;margin:4px 0 8px">Quando a sua ação estiver acabando, renove as mesmas posições para um novo período — liberado só se a vaga estiver livre e <b>não houver fila</b> (quem está na fila tem prioridade).</div>'+
        '<div class="row"><label><b>Novo início</b><input id="rcini" type="date"></label><label><b>Novo fim</b><input id="rcfim" type="date"></label></div>'+
        '<div class="msg" id="rcmsg"></div><button class="btn" id="rcbtn" style="margin-top:4px">Recomprar estas posições</button></div>'+
      '<div style="height:30px"></div>';
    [].forEach.call(app.querySelectorAll('[data-cp]'),function(b){b.onclick=function(){anexarComprovante(b.getAttribute('data-cp'));};});
    [].forEach.call(app.querySelectorAll('[data-reenv]'),function(b){b.onclick=function(){reenviarMaterial(b.getAttribute('data-reenv'));};});
    el('infpag').onclick=infoPagamento;
    function loadBrief(){ get('/acompanhamento/'+token+'/briefing').then(function(r){
      var lw=el('brieflist'); if(!lw)return; var ms=(r&&r.mensagens)||[];
      lw.innerHTML=ms.map(function(m){ var gest=m.autor==='gestao'; var img=/^image\//.test(m.anexo_mime||'');
        var anexo=m.tem_anexo?(img?'<a href="'+API+'/briefing/'+m.id+'/anexo" target="_blank" rel="noopener"><img src="'+API+'/briefing/'+m.id+'/anexo" style="max-height:120px;border-radius:8px;margin-top:4px;border:1px solid #eee"></a>':'<a href="'+API+'/briefing/'+m.id+'/anexo" target="_blank" rel="noopener" style="font-size:12px;color:#2563eb">📎 '+h(m.anexo_nome||'anexo')+'</a>'):'';
        return '<div style="justify-self:'+(gest?'start':'end')+';background:'+(m.tipo==='comprovacao'?'#E6F4EC':(gest?'#F3F7F4':'#EFF6FF'))+';border-radius:10px;padding:7px 10px;max-width:88%">'+
          '<div style="font-size:10.5px;color:#64748b;font-weight:700">'+(gest?'🏢 ':'🏷️ ')+h(m.autor_nome||(gest?'Gestão':'Você'))+(m.tipo==='comprovacao'?' · ✅ comprovação':'')+' · '+h((m.criado_em||'').slice(0,10))+'</div>'+
          (m.texto?'<div style="font-size:13px;margin-top:2px;white-space:pre-wrap">'+h(m.texto)+'</div>':'')+anexo+'</div>';
      }).join('')||'<div style="font-size:12px;color:#aaa">Sem mensagens ainda.</div>';
      lw.scrollTop=lw.scrollHeight;
    }); }
    loadBrief();
    el('briefsend').onclick=function(){ var t=(el('brieftxt').value||'').trim(); var f=el('brieffile').files[0];
      if(!t&&!f)return; el('briefsend').disabled=true;
      function send(body){ post('/acompanhamento/'+token+'/briefing',body).then(function(r){ el('briefsend').disabled=false; if(r.ok){el('brieftxt').value='';el('brieffile').value='';loadBrief();} else alert((r.j&&r.j.erro)||'Erro.'); }); }
      if(f){ readFile(el('brieffile'),function(ff){ send({texto:t||undefined,anexo:ff.b64,mime:ff.mime,nome:f.name}); }); } else send({texto:t}); };
    el('rcbtn').onclick=function(){
      var b={vigencia_ini:el('rcini').value,vigencia_fim:el('rcfim').value};var x=el('rcmsg');
      if(!b.vigencia_ini||!b.vigencia_fim){x.className='msg err';x.textContent='Informe o novo período.';return;}
      el('rcbtn').disabled=true;x.className='msg';x.textContent='Verificando disponibilidade…';
      post('/acompanhamento/'+token+'/recompra',b).then(function(r){
        if(r.ok){location.href='/trade.html?t='+r.j.token;return;}
        x.className='msg err';x.textContent=(r.j&&r.j.erro)||'Não foi possível recomprar.';el('rcbtn').disabled=false;
      });
    };
    if(!d.comprovacao_enviada){el('cenv').onclick=function(){readFile(el('cfoto'),function(f){if(!f){cm('Escolha a foto.',true);return;}el('cenv').disabled=true;cm('Enviando…');post('/acompanhamento/'+token+'/comprovacao',{foto:f.b64,mime:f.mime}).then(function(r){if(r.ok)verAcompanhamento();else{cm(r.j.erro||'Erro.',true);el('cenv').disabled=false;}});});};}
    function cm(t,e){var x=el('cmsg');if(x){x.textContent=t;x.className='msg'+(e?' err':' ok');}}
  });
}
function reenviarMaterial(iid){
  var m=document.createElement('div');m.className='modal';var _f=null;
  m.innerHTML='<div class="sheet"><h2>Reenviar material</h2><p style="color:#64748b;font-size:13px">A nossa equipe pediu um ajuste. Envie a nova arte/spot/vídeo <b>ou</b> o texto para leitura ao vivo.</p>'+
    '<label><b>Nova arte / spot / vídeo</b><input type="file" id="rmf" accept="image/*,video/*,audio/*"></label><div id="rmprev"></div>'+
    '<label style="margin-top:8px"><b>…ou texto para leitura ao vivo</b><textarea id="rmt" rows="2" placeholder="o texto que vai ao ar"></textarea></label>'+
    '<div class="msg" id="rmm"></div><div style="display:flex;gap:10px;margin-top:10px"><button class="btn sec" id="rmc" style="flex:1">Fechar</button><button class="btn" id="rmo" style="flex:2">Reenviar</button></div></div>';
  document.body.appendChild(m);el('rmc').onclick=function(){m.remove();};m.onclick=function(ev){if(ev.target===m)m.remove();};
  el('rmf').onchange=function(){readFile(el('rmf'),function(f){_f=f;el('rmprev').innerHTML=f&&/^image/.test(f.mime)?'<img src="data:'+f.mime+';base64,'+f.b64+'" style="max-width:100%;border-radius:10px;margin-top:8px">':(f?'<div style="font-size:12px;color:#1E874B;margin-top:6px">✓ '+h(f.mime)+'</div>':'');});};
  el('rmo').onclick=function(){var txt=(el('rmt').value||'').trim();var body=_f?{arte:_f.b64,mime:_f.mime}:(txt?{texto:txt}:null);
    if(!body){el('rmm').className='msg err';el('rmm').textContent='Anexe a arte ou escreva o texto.';return;}
    el('rmo').disabled=true;post('/acompanhamento/'+token+'/item/'+iid+'/material',body).then(function(r){if(r.ok){m.remove();verAcompanhamento();}else{el('rmm').className='msg err';el('rmm').textContent=r.j.erro||'Erro.';el('rmo').disabled=false;}});};
}
function anexarComprovante(num){
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="sheet"><h2>Comprovante do pagamento</h2><p style="color:#64748b;font-size:13px">Anexe o comprovante da parcela '+num+'.</p><input type="file" id="xf" accept="image/*,application/pdf" capture="environment"><div class="msg" id="xm"></div><div style="display:flex;gap:10px;margin-top:10px"><button class="btn sec" id="xc" style="flex:1">Fechar</button><button class="btn" id="xo" style="flex:2">Enviar</button></div></div>';
  document.body.appendChild(m);el('xc').onclick=function(){m.remove();};
  el('xo').onclick=function(){readFile(el('xf'),function(f){if(!f){el('xm').className='msg err';el('xm').textContent='Escolha o arquivo.';return;}el('xo').disabled=true;post('/acompanhamento/'+token+'/parcela/'+num+'/comprovante',{foto:f.b64,mime:f.mime}).then(function(r){if(r.ok){m.remove();verAcompanhamento();}else{el('xm').className='msg err';el('xm').textContent=r.j.erro||'Erro.';el('xo').disabled=false;}});});};
}
function infoPagamento(){
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="sheet"><h2>Informar pagamento</h2><p style="color:#64748b;font-size:13px">Registre um pagamento que você fez (boleto, bonificação, depósito) e anexe o comprovante.</p>'+
    '<div class="row"><label><b>Data</b><input id="iv" type="date"></label><label><b>Valor</b><input id="ivl" type="number" placeholder="0,00"></label></div>'+
    '<label><b>Forma</b><select id="if"><option value="deposito">Depósito</option><option value="abatimento">Abatimento em boleto</option><option value="bonificacao">Bonificação</option></select></label>'+
    '<label><b>Comprovante</b><input type="file" id="ifoto" accept="image/*,application/pdf" capture="environment"></label>'+
    '<div class="msg" id="im"></div><div style="display:flex;gap:10px;margin-top:8px"><button class="btn sec" id="ic" style="flex:1">Fechar</button><button class="btn" id="io" style="flex:2">Salvar</button></div></div>';
  document.body.appendChild(m);el('ic').onclick=function(){m.remove();};
  el('io').onclick=function(){readFile(el('ifoto'),function(f){
    var b={vencimento:el('iv').value||null,valor:Number(el('ivl').value)||0,forma:el('if').value};if(f){b.foto=f.b64;b.mime=f.mime;}
    if(!b.valor&&!f){el('im').className='msg err';el('im').textContent='Informe o valor ou anexe o comprovante.';return;}
    el('io').disabled=true;post('/acompanhamento/'+token+'/pagamento',b).then(function(r){if(r.ok){m.remove();verAcompanhamento();}else{el('im').className='msg err';el('im').textContent=r.j.erro||'Erro.';el('io').disabled=false;}});
  });};
}
})();
</script></body></html>
