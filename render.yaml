# Configuração de deploy para a Render (https://render.com)
# Como usar: no painel da Render → New → Blueprint → conecte este repositório.
#
# IMPORTANTE sobre o BANCO (SQLite):
#   • O banco é um arquivo (mutti.db). Pra ele NÃO sumir a cada deploy, ele precisa ficar
#     num DISCO PERSISTENTE (bloco "disk" abaixo). Disco exige plano PAGO na Render
#     (o plano "free" não tem disco → o banco é apagado a cada deploy/restart).
#   • O setup.js agora é PROTEGIDO: só cria o banco na 1ª vez; nos deploys seguintes ele
#     NÃO apaga nada (só as migrações rodam, de forma idempotente). Pra resetar de
#     propósito, use SETUP_FORCE=1.
#   • 1º deploy cria o banco com os dados-semente. Para subir os seus dados reais,
#     copie o seu mutti.db local para /data/mutti.db no disco (ver docs/deploy.md).

services:
  - type: web
    name: mutti-sistema
    runtime: node
    plan: starter            # precisa ser pago p/ ter disco persistente (free perde o banco)
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install && node src/db/setup.js && node src/db/migrar-pendentes.js
    startCommand: cd backend && npm start
    disk:
      name: mutti-data
      mountPath: /data       # o banco mora aqui (persiste entre deploys)
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/mutti.db   # aponta pro disco persistente
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Lembre de configurar também (no painel da Render → Environment), se usar:
      #   ANTHROPIC_API_KEY  (Rhia, OCR das NFs/Tesouraria)
      #   DATABASE_URL / PG* (conexão READ-ONLY ao ERP A7, se o servidor acessar o Postgres)
      #   credenciais de e-mail (IMAP/SMTP), tokens de integração, etc.
